name: Build ESP32 Firmware

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build PlatformIO container
        run: |
          podman build \
            -f firmware/Dockerfile.platformio \
            -t ducati-platformio:latest \
            firmware/

      - name: Create PlatformIO cache volume
        run: |
          podman volume inspect platformio-data >/dev/null 2>&1 || \
          podman volume create platformio-data

      - name: Build firmware
        run: |
          podman run --rm \
            -v "$PWD:/workspace:Z" \
            -v platformio-data:/root/.platformio:Z \
            -w /workspace/firmware \
            ducati-platformio:latest \
            run

      - name: Show firmware
        run: |
          find firmware/.pio \
            -type f \
            -name "firmware.bin" \
            -exec ls -lh {} \;