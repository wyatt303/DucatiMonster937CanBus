name: Build ESP32 Firmware

on:
  push:
    branches:
      - main

    tags:
      - "fw-v*"

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build PlatformIO container
        run: |
          podman build \
            -f firmware/Dockerfile.platformio \
            -t ducati-platformio:latest \
            firmware/

      - name: Create PlatformIO cache volume
        run: |
          podman volume inspect platformio-data >/dev/null 2>&1 || \
          podman volume create platformio-data

      - name: Build firmware
        run: |
          podman run --rm \
            -v "$PWD:/workspace:Z" \
            -v platformio-data:/root/.platformio:Z \
            -w /workspace/firmware \
            ducati-platformio:latest \
            run

      - name: Find firmware
        run: |
          find firmware/.pio \
            -type f \
            -name "firmware.bin" \
            -exec ls -lh {} \;

      - name: Prepare release firmware
        if: startsWith(github.ref, 'refs/tags/fw-v')
        run: |
          VERSION="${GITHUB_REF_NAME#fw-v}"

          mkdir -p release

          FW_FILE="$(find firmware/.pio -type f -name firmware.bin | head -n 1)"

          cp "$FW_FILE" "release/ducati-firmware-${VERSION}.bin"

          sha256sum \
            "release/ducati-firmware-${VERSION}.bin" \
            > "release/ducati-firmware-${VERSION}.bin.sha256"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/fw-v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Firmware ${{
            github.ref_name
          }}"
          generate_release_notes: true
          files: |
            release/*.bin
            release/*.sha256